name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast set: Speed=Slow exhaustive tests are skipped unless SODRPG_SLOW=1
  # (see SlowFactAttribute). Jobs build only what they test; projects run in
  # parallel because each test assembly serializes its own tests (shared
  # StarClusters/Loc game state).
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: python tools/balance/gen_cs.py --check
      - run: python -m unittest discover -s tools/tests -p "test_*.py"
      - run: dotnet build -c Release tests/SodRpg.Core.Tests
      - run: dotnet test -c Release tests/SodRpg.Core.Tests --no-build

  mod-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [tests/Issue73.Native.Tests, tests/SodRpg.Mod.Startup.Tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: python tools/balance/gen_cs.py --check
      - run: dotnet build -c Release ${{ matrix.project }}
      - run: dotnet test -c Release ${{ matrix.project }} --no-build

  # Full exhaustive set (all heroes, all seeds) after merges to main and for
  # releases; PRs only pay for the fast set above.
  slow-tests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: python tools/balance/gen_cs.py --check
      - run: dotnet build -c Release tests/SodRpg.Core.Tests
      - run: dotnet test -c Release tests/SodRpg.Core.Tests --no-build --filter "Speed=Slow"
        env:
          SODRPG_SLOW: "1"

  # Dreamborne mob sources: a clean checkout must reconstruct the exact 63
  # source files from all 88 archive parts and pass the offline validators.
  mob-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/materialize_mob_assets.py
      - run: python tools/materialize_mob_assets.py --verify-only
      - run: python tools/validate_mob_assets.py
      - run: python -m unittest discover -s tests/assets -v

  # Mob asset build tooling: config validation, isolated project preparation
  # and review packaging contracts (no Unity editor in CI).
  mob-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/MobAssetBuilder/tests -v
