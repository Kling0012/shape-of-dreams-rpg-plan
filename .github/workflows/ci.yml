name: ci

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "!src/SodRpg.Mod/about/**"
      # Tests copy this reviewed table into their output as ReviewedV129.md.
      - docs/specs/v1.29-uniques-table.md
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "!src/SodRpg.Mod/about/**"
      # Tests copy this reviewed table into their output as ReviewedV129.md.
      - docs/specs/v1.29-uniques-table.md
  workflow_dispatch:

# A newer push to the same branch (several merges in a row) supersedes the older
# run. Label-triggered runs get their own group (one per label) so adding a
# label never cancels a push/synchronize run in progress, and vice versa.
concurrency:
  group: ci-${{ github.event.action == 'labeled' && format('label-{0}', github.event.label.name) || 'fast' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast set: Speed=Slow exhaustive tests are skipped unless SODRPG_SLOW=1
  # (see SlowFactAttribute). Jobs build only what they test; projects run in
  # parallel because each test assembly serializes its own tests (shared
  # StarClusters/Loc game state).
  core-tests:
    # A label event only re-runs slow-tests; the fast set keeps its earlier result.
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: python tools/balance/gen_cs.py --check
      - run: python tools/test_changed.py --check-ci-matrix
      - run: python -m unittest discover -s tools/tests -p "test_*.py"
      - run: dotnet build -c Release tests/SodRpg.Core.Tests
      - run: dotnet test -c Release tests/SodRpg.Core.Tests --no-build
      # Wiki publication runs after a merge; catch incompatible Core APIs on PRs.
      - run: dotnet build -c Release tools/WikiGen

  mod-tests:
    # A label event only re-runs slow-tests; the fast set keeps its earlier result.
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [tests/Issue73.Native.Tests, tests/SodRpg.Mod.Startup.Tests, tests/SodRpg.Mod.FxBudget.Tests, tests/SodRpg.Mod.AutoCast.Tests, tests/SodRpg.Culinary.Tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      # Generation freshness is checked once by core-tests on the same push.
      - run: dotnet build -c Release ${{ matrix.project }}
      - run: dotnet test -c Release ${{ matrix.project }} --no-build

  # Full exhaustive set (all heroes, all seeds) after merges to main, for
  # releases, on manual dispatch, and on PRs carrying the ci-full label
  # (added just before merge); other PRs only pay for the fast set above.
  # One matrix entry per class
  # holding Speed=Slow tests, the same per-class process split as
  # tools/test_changed.py --slow (each test assembly serializes its own tests,
  # so the parallelism comes from separate processes). The trailing separator
  # in each filter term keeps the contains-match inside the class (a future
  # class whose name merely starts with an existing one must not run twice);
  # the ``+`` twin term also catches nested classes (Ns.X+Nested), which a
  # dot-only term would silently miss. When a new slow test class appears,
  # add it here; the core-tests job runs
  # `python tools/test_changed.py --check-ci-matrix`, which fails when this
  # matrix and the detected slow classes disagree. Generation freshness is
  # already enforced by the core-tests job on the same push, so the matrix
  # entries skip the ~2 min gen_cs --check and only build and test.
  slow-tests:
    # Main pushes, manual dispatch, and ci-full PRs. The last clause keeps a
    # labeled event to a single label: other labels added to a PR that already
    # carries ci-full must not re-run the heavy matrix.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'ci-full')
          && (github.event.action != 'labeled' || github.event.label.name == 'ci-full'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        class:
          - SodRpg.Core.Tests.AllocationEquivalenceV131Tests
          - SodRpg.Core.Tests.GeneratedHeroAcceptanceTests
          - SodRpg.Core.Tests.PerformanceTests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet build -c Release tests/SodRpg.Core.Tests
      - run: dotnet test -c Release tests/SodRpg.Core.Tests --no-build --filter "Speed=Slow&(FullyQualifiedName~${{ matrix.class }}.|FullyQualifiedName~${{ matrix.class }}+)"
        env:
          SODRPG_SLOW: "1"
