name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --verbosity normal

  mob-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: python -m unittest discover -s tools/MobAssetBuilder/tests -v
      # Engine doubles compile the actual new adapter, but do not prove Unity/game compatibility.
      - run: dotnet test tests/MobRuntime.Tests/MobRuntime.Tests.csproj -c Release --verbosity normal

  mob-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # A clean checkout must reconstruct the exact 63 source files from all 88 parts.
      - run: python tools/materialize_mob_assets.py
      - run: python tools/materialize_mob_assets.py --verify-only
      - run: python tools/validate_mob_assets.py
      - run: python -m unittest discover -s tests/assets -v
